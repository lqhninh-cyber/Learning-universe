<svg viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mẫu lá nghiêng trái -->
    <g id="fav-leaf-L">
      <path d="M0,0 C-4,-6 -8,-14 0,-20 C8,-14 4,-6 0,0 Z" fill="#739B88" />
      <path d="M0,0 C-2,-6 -4,-13 0,-18" stroke="#F5F2EB" stroke-width="0.8" opacity="0.7" />
    </g>
    <!-- Mẫu lá đón sáng -->
    <g id="fav-leaf-Light">
      <path d="M0,0 C-3,-5 -7,-12 0,-18 C7,-12 3,-5 0,0 Z" fill="#F5F2EB" />
    </g>
  </defs>

  <!-- Nền xanh sơn mài sẫm & Viền vàng thếp -->
  <rect width="320" height="320" rx="64" fill="#0A1F16" />
  <rect x="6" y="6" width="308" height="308" rx="58" stroke="#C5A262" stroke-opacity="0.3" stroke-width="4" fill="none" />

  <g transform="translate(0, 30)">
