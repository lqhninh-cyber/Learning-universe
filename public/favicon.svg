<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Nền xanh sơn mài sẫm -->
  <rect width="64" height="64" rx="14" fill="#0A261D" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#C5A262" stroke-opacity="0.25" stroke-width="1.2" />

  <!-- Quỹ đạo thiên thể (Nửa sau) -->
  <path
    d="M 13 36 C 10 30, 22 18, 51 22"
    stroke="#C5A262"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-opacity="0.6"
  />

  <!-- Thân cây & Bệ đỡ sách mở -->
  <g id="lu-favicon-tree">
    <!-- Cặp trang sách mở đón sáng -->
    <path
      d="M 14 47 C 22 43.5, 28 47.5, 32 46.5 L 32 51 C 28 52, 22 47.5, 14 51 Z"
      fill="#F5F2EB"
    />
    <path
      d="M 50 47 C 42 43.5, 36 47.5, 32 46.5 L 32 51 C 36 52, 42 47.5, 50 51 Z"
      fill="#F5F2EB"
    />
    <!-- Sống sách vàng -->
    <path
      d="M 32 46.5 C 30.5 48.5, 33.5 48.5, 32 52.5"
      stroke="#C5A262"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- Rễ & Thân vươn thẳng -->
    <path
      d="M 32 47 L 32 26"
      stroke="#1B4332"
      stroke-width="3"
      stroke-linecap="round"
    />
    <path
      d="M 32 38 C 26 36, 21 31, 20 25"
      stroke="#1B4332"
      stroke-width="1.8"
      stroke-linecap="round"
    />
    <path
      d="M 32 38 C 38 36, 43 31, 44 25"
      stroke="#1B4332"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Tán lá Men Ngọc & Trắng Dó -->
    <!-- Tầng lá dưới -->
    <path
      d="M 19 25 C 15 22, 19 16, 24 20 C 24 23, 21 25, 19 25 Z"
      fill="#3D6953"
    />
    <path
      d="M 45 25 C 49 22, 45 16, 40 20 C 40 23, 43 25, 45 25 Z"
      fill="#3D6953"
    />

    <!-- Tầng lá giữa Men Ngọc -->
    <path
      d="M 23 20 C 20 15, 27 12, 30 17 C 29 20, 26 21, 23 20 Z"
      fill="#739B88"
    />
    <path
      d="M 41 20 C 44 15, 37 12, 34 17 C 35 20, 38 21, 41 20 Z"
      fill="#739B88"
    />

    <!-- Vương miện hoa sen triều Lý ở đỉnh -->
    <path
      d="M 32 26 C 26 24, 25 18, 28 14 C 30 18, 31 22, 32 26 Z"
      fill="#739B88"
    />
    <path
      d="M 32 26 C 38 24, 39 18, 36 14 C 34 18, 33 22, 32 26 Z"
      fill="#739B88"
    />
    <path
      d="M 32 11 C 28 15, 28 22, 32 26 C 36 22, 36 15, 32 11 Z"
      fill="#F5F2EB"
    />
    <!-- Ngọc châu đỉnh sen -->
    <circle cx="32" cy="10" r="2.2" fill="#C5A262" />
  </g>

  <!-- Quỹ đạo thiên thể (Nửa trước) & Các vì tinh tú -->
  <path
    d="M 51 22 C 54 28, 42 42, 13 36"
    stroke="#C5A262"
    stroke-width="2"
    stroke-linecap="round"
  />
  <circle cx="13" cy="36" r="2" fill="#E2C48D" />
  <circle cx="51" cy="22" r="2" fill="#E2C48D" />
  <circle cx="37" cy="39" r="1.6" fill="#F5F2EB" />
  <circle cx="23" cy="38" r="1.4" fill="#E2C48D" />
</svg>
