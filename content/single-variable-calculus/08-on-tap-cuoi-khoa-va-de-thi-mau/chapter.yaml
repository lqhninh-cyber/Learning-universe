id: on-tap-cuoi-khoa-va-de-thi-mau
number: 8
title: Ôn tập cuối khóa & Đề thi mẫu
description: 'Hệ thống trọng tâm lý thuyết, bài tập ôn thi và 5 câu tự luận đề mẫu.'
objectives:
  - 'Tổng kết toàn bộ sơ đồ kiến thức trọng tâm từ Chương 1 đến Chương 7.'
  - 'Rèn luyện kỹ năng phân tích và trình bày lời giải chứng minh giải tích chuẩn mực.'
  - 'Làm quen với cấu trúc đề thi kết thúc học phần MATH1403 qua 5 câu hỏi tự luận mẫu.'
