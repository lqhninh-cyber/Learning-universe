id: nhom
title: Nhóm và Nhóm con
description: Phép toán hai ngôi, nửa nhóm, vị nhóm, nhóm và các tính chất cơ bản của nhóm.
objectives:
  - Nắm vững khái niệm phép toán hai ngôi và định nghĩa nhóm.
  - Chứng minh được tính duy nhất của phần tử trung hòa và phần tử nghịch đảo.
  - Vận dụng quy tắc giản ước và tính chất nghịch đảo của tích trong nhóm.
